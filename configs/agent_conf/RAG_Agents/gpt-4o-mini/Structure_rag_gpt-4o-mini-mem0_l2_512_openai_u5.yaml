# gpt-4o-mini mem0 — U5 conflict-resolution (Phase 1) variant.
# IDENTICAL to Structure_rag_gpt-4o-mini-mem0_l2_512_openai.yaml EXCEPT:
#   - isolated qdrant store path + collection (does NOT touch the 09 baseline store)
#   - isolated output_dir
# The U5 update component is gated by env var MEM0_UPDATE_MODE=u5_classification
# (set in the launch script), so the same extraction/cache/candidate-pool/retrieval
# are reused; only the update LLM's job + ordinal visibility differ.
agent_name: Structure_rag_gpt-4o-mini-mem0_l2_512_openai_u5
model: gpt-4o-mini
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gpt-4o-mini-mem0-chunk512-temp0-l2-openai-u5

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: openai
    config:
      model: gpt-4o-mini
      temperature: 0
      max_tokens: 16384
  embedder:
    provider: openai
    config:
      model: text-embedding-3-small
      embedding_dims: 1536
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_gpt4o_l2_512_openai_u5
      embedding_model_dims: 1536
      path: analysis/results/expanded/stores/qdrant_gpt4o_512_openai_u5
      on_disk: true
  use_l2_fc_prompt: true
