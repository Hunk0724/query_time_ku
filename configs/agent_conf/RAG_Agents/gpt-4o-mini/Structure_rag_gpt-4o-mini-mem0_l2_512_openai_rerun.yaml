# gpt-4o-mini mem0 VANILLA — identical to ..._l2_512_openai.yaml but isolated
# store/output so a matched re-run does NOT clobber the 09 baseline artifacts.
# Used as the apples-to-apples vanilla baseline against the U5 variant.
agent_name: Structure_rag_gpt-4o-mini-mem0_l2_512_openai_rerun
model: gpt-4o-mini
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gpt-4o-mini-mem0-chunk512-temp0-l2-openai-rerun

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: openai
    config:
      model: gpt-4o-mini
      temperature: 0
      max_tokens: 16384
  embedder:
    provider: openai
    config:
      model: text-embedding-3-small
      embedding_dims: 1536
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_gpt4o_l2_512_openai_rerun
      embedding_model_dims: 1536
      path: analysis/results/expanded/stores/qdrant_gpt4o_512_openai_rerun
      on_disk: true
  use_l2_fc_prompt: true
