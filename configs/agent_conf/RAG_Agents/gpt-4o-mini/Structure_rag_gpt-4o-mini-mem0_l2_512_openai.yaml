# gpt-4o-mini mem0 — chunk 512 + OpenAI embedding(authentic)+ L2(凍結 cache 撇除抽取變因)
# + temp 0。scale 分析主設定(6k/32k/64k/262k);agent.py 依 sub_dataset 自動隔離 qdrant store。
agent_name: Structure_rag_gpt-4o-mini-mem0_l2_512_openai
model: gpt-4o-mini
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gpt-4o-mini-mem0-chunk512-temp0-l2-openai

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: openai
    config:
      model: gpt-4o-mini
      temperature: 0
      max_tokens: 16384
  embedder:
    provider: openai
    config:
      model: text-embedding-3-small
      embedding_dims: 1536
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_gpt4o_l2_512_openai
      embedding_model_dims: 1536
      path: analysis/results/expanded/stores/qdrant_gpt4o_512_openai
      on_disk: true
  use_l2_fc_prompt: true
