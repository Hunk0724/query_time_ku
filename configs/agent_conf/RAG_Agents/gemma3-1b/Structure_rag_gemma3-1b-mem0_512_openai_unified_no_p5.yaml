# Gemma3-1B mem0 — phase2 with MEM0_P5_SKIP=1 (weak-model regime, no P5).
agent_name: Structure_rag_gemma3-1b-mem0_512_openai_unified_no_p5
model: gemma3:1b
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gpt-4o-mini-mem0-chunk512-temp0-openai-unified_no_p5__gemma3-1b

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: ollama
    config:
      model: gemma3:1b
      temperature: 0
      max_tokens: 2048
      ollama_base_url: http://localhost:11434
  embedder:
    provider: openai
    config:
      model: text-embedding-3-small
      embedding_dims: 1536
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_gpt4o_512_openai_unified_no_p5__gemma3-1b
      embedding_model_dims: 1536
      path: analysis/results/expanded/stores/qdrant_gpt4o_512_openai_unified_no_p5__gemma3-1b
      on_disk: true
  use_unified_extractor: true
