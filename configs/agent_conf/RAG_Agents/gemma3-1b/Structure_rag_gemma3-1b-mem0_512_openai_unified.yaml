# Gemma3-1B mem0 — UNIFIED EXTRACTOR (weak-model regime, 2026-07-01).
# Mirrors gpt-4o-mini-mem0_512_openai_unified.yaml EXCEPT:
#  - LLM provider switched to Ollama (mem0 internal + P4 answer LLM both use gemma3:1b).
#  - Embedding KEPT on OpenAI text-embedding-3-small to isolate the LLM variable
#    (cross-model results are then comparable on retrieval and only differ in LLM steps).
#  - Output / store paths suffixed with __gemma3-1b to avoid colliding with OpenAI runs.
agent_name: Structure_rag_gemma3-1b-mem0_512_openai_unified
model: gemma3:1b
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gpt-4o-mini-mem0-chunk512-temp0-openai-unified__gemma3-1b

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: ollama
    config:
      model: gemma3:1b
      temperature: 0
      max_tokens: 2048
      ollama_base_url: http://localhost:11434
  embedder:
    provider: openai
    config:
      model: text-embedding-3-small
      embedding_dims: 1536
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_gpt4o_512_openai_unified__gemma3-1b
      embedding_model_dims: 1536
      path: analysis/results/expanded/stores/qdrant_gpt4o_512_openai_unified__gemma3-1b
      on_disk: true
  use_unified_extractor: true
