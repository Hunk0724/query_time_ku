# Mem0 (vector) — L2 + frozen cache, 6k, MINIMAL-thinking re-run (2026-06-06).
# Parallel namespace to the original High-thinking l2 run (which backs docs 02/03);
# code thinking is now globally minimal, so this re-run isolates the thinking effect
# at fixed length (extraction cache shared → identical facts; only update/answer
# thinking differs). For clean 6k→32k→64k minimal trend vs the minimal 64k run.
agent_name: Structure_rag_mem0_gemini-3.1-flash-lite_chunk512_factaware_l2_min
model: gemini-3.1-flash-lite
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gemini-3.1-flash-lite-mem0-chunk512-temp0-factaware-l2-min

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: vertexai
    config:
      model: gemini-3.1-flash-lite
      temperature: 0
      max_tokens: 16384
  embedder:
    provider: vertexai
    config:
      model: text-embedding-004
      embedding_dims: 768
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_vertex_factaware_l2_min_768
      embedding_model_dims: 768
      path: /tmp/qdrant_mem0_vertex_factaware_l2_min
  use_l2_fc_prompt: true
