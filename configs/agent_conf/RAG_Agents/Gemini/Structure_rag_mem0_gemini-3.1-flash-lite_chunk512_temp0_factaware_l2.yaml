# Mem0 (vector) — L2 + frozen extraction cache (2026-06-04). 6k.
# L2 knowledge-extraction prompt (reliable on FC general facts) as fallback;
# MEM0_EXTRACTION_CACHE (set at launch) supplies a frozen complete extraction so
# SH/MH and re-runs ingest IDENTICAL facts. Fresh namespace; L1 runs preserved.
agent_name: Structure_rag_mem0_gemini-3.1-flash-lite_chunk512_factaware_l2
model: gemini-3.1-flash-lite
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gemini-3.1-flash-lite-mem0-chunk512-temp0-factaware-l2

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: vertexai
    config:
      model: gemini-3.1-flash-lite
      temperature: 0
      max_tokens: 16384
  embedder:
    provider: vertexai
    config:
      model: text-embedding-004
      embedding_dims: 768
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_vertex_factaware_l2_768
      embedding_model_dims: 768
      path: /tmp/qdrant_mem0_vertex_factaware_l2
  use_l2_fc_prompt: true
