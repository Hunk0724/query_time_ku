# Mem0g (graph-augmented) with Vertex Gemini + local Neo4j.
# Same as mem0 yaml but adds graph_store. mem0 automatically enables MemoryGraph
# when graph_store.config is present (see mem0/memory/main.py:58).
# Requires local Neo4j (Docker recommended, see docs/infrastructure/neo4j_setup.md).
agent_name: Structure_rag_mem0g_gemini-2.5-flash-lite_chunk4096
model: gemini-2.5-flash-lite
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gemini-2.5-flash-lite-mem0g-chunk4096

agent_chunk_size: 4096
retrieve_num: 100

mem0_config:
  llm:
    provider: vertexai
    config:
      model: gemini-2.5-flash-lite
      temperature: 0.1   # Phase 0 deterministic
      max_tokens: 16384   # bumped from 8192 for ctx sweep — Update Memory enumerates all prior memories setting
  embedder:
    provider: vertexai                 # → methods/mem0_vertex_adc_embedder.py (ADC)
    config:
      model: text-embedding-004        # mem0 internal Gemini class default
      embedding_dims: 768
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_vertex_t4_768
      embedding_model_dims: 768
      path: /tmp/qdrant_mem0_vertex_t4
  # Remove 2 rejection few-shots from mem0's FACT_RETRIEVAL_PROMPT that cause
  # Gemini to drop FC inputs (Phase 0 validated; see methods/mem0_fc_prompt_fix.py)
  use_l1_fc_prompt: true
  graph_store:
    provider: neo4j
    config:
      url: neo4j://localhost:7687
      username: neo4j
      password: mem0gpassword          # 與 docs/infrastructure/neo4j_setup.md 對齊
