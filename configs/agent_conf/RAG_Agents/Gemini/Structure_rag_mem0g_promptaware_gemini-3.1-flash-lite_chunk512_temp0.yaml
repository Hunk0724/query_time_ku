# Mem0g-prompt-aware Plan A — temp=0 (top + mem0 internal).
# Restores upstream mem0g cookbook pattern (graph relations into prompt).
# See docs/baseline_methods/mem0g_reproducibility.md
agent_name: Structure_rag_mem0g_promptaware_gemini-3.1-flash-lite_chunk512_temp0
model: gemini-3.1-flash-lite
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gemini-3.1-flash-lite-mem0g-promptaware-chunk512-temp0

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: vertexai
    config:
      model: gemini-3.1-flash-lite
      temperature: 0                     # Plan A — fully deterministic
      max_tokens: 16384
  embedder:
    provider: vertexai
    config:
      model: text-embedding-004
      embedding_dims: 768
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0g_promptaware_t4_768
      embedding_model_dims: 768
      path: /tmp/qdrant_mem0g_promptaware_t4
  use_l1_fc_prompt: true
  prompt_aware_graph: true              # ← enables relations verbalization in agent.py:_handle_mem0_agent
  graph_store:
    provider: neo4j
    config:
      url: neo4j://localhost:7687
      username: neo4j
      password: mem0gpassword
