# Mem0 (vector) — T7 32k diagnostic run for write-time scaling (2026-06-04).
# Same as the 6k factaware yaml; only the dataset (32k) and fresh namespace differ.
# Tests whether a larger store (2310 facts) breaks write-time conflict resolution
# (H1 candidate-miss / cross-fact contamination) vs the 6k baseline.
agent_name: Structure_rag_mem0_gemini-3.1-flash-lite_chunk512_factaware_32k
model: gemini-3.1-flash-lite
temperature: 0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gemini-3.1-flash-lite-mem0-chunk512-temp0-factaware-32k

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: vertexai
    config:
      model: gemini-3.1-flash-lite
      temperature: 0
      max_tokens: 16384
  embedder:
    provider: vertexai
    config:
      model: text-embedding-004
      embedding_dims: 768
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_vertex_factaware_32k_768
      embedding_model_dims: 768
      path: /tmp/qdrant_mem0_vertex_factaware_32k
  use_l1_fc_prompt: true
