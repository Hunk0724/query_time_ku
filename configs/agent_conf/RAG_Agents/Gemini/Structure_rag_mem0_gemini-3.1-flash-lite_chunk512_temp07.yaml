# Mem0 (vector) with temperature=0.7, aligned with benchmark default.
# Compared to ..._chunk512.yaml: top-level + mem0 internal LLM both 0.7
# See docs/baseline_methods/CRITICAL_FINDINGS_2026-05-29_evening.md F3
agent_name: Structure_rag_mem0_gemini-3.1-flash-lite_chunk512
model: gemini-3.1-flash-lite
temperature: 0.7                       # aligned with benchmark default (Structure_rag_gpt-4o-mini-mem0.yaml:3)
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./outputs/gemini-3.1-flash-lite-mem0-chunk512-temp07

agent_chunk_size: 512
retrieve_num: 100

mem0_config:
  llm:
    provider: vertexai
    config:
      model: gemini-3.1-flash-lite
      temperature: 0.7                 # aligned with benchmark default
      max_tokens: 16384
  embedder:
    provider: vertexai
    config:
      model: text-embedding-004
      embedding_dims: 768
  vector_store:
    provider: qdrant
    config:
      collection_name: mem0_vertex_t4_768
      embedding_model_dims: 768
      path: /tmp/qdrant_mem0_vertex_t4
  use_l1_fc_prompt: true
